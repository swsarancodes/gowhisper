name: GoSpellMobile
options:
  minimumXcodeGenVersion: 2.46.0
  bundleIdPrefix: com.goml.gospell
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "2660"
packages:
  FluidAudio:
    url: https://github.com/FluidInference/FluidAudio.git
    exactVersion: 0.15.5
settings:
  base:
    DEVELOPMENT_TEAM: 5NZ4Q7NXJ4
    SWIFT_VERSION: 6.0
    # The compiler finds the interface's strings for the String Catalogs (Localizable.xcstrings).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
targets:
  GoSpellMobile:
    type: application
    platform: iOS
    sources:
      - GoSpellMobile
      - GoSpellShared
      - GoSpellActivity
      - path: ../app/AppIcon.icon
        buildPhase: resources
    dependencies:
      - package: FluidAudio
      - target: GoSpellKeyboard
        embed: true
      - target: GoSpellWidgets
        embed: true
    info:
      path: GoSpellMobile/Info.plist
      properties:
        CFBundleDisplayName: GoSpell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: com.goml.gospell.mobile.keyboard-session
            CFBundleURLSchemes:
              - gospell-dictation
        NSMicrophoneUsageDescription: GoSpell turns what you say into text on this iPhone. Audio never leaves it and is deleted once it's transcribed.
        NSSpeechRecognitionUsageDescription: GoSpell uses Apple's on-device speech recognition to turn what you say into text. Nothing you say is sent to a server.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes:
          - audio
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: GoSpellMobile/GoSpellMobile.entitlements
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        OTHER_LDFLAGS: $(inherited) -weak_framework FoundationModels
        OTHER_SWIFT_FLAGS: $(inherited) -Xfrontend -disable-autolink-framework -Xfrontend FoundationModels
        PRODUCT_BUNDLE_IDENTIFIER: com.goml.gospell.mobile
        PRODUCT_NAME: GOSPELL
    scheme:
      gatherCoverageData: false
      testTargets:
        - GoSpellMobileTests
  GoSpellKeyboard:
    type: app-extension
    platform: iOS
    sources:
      - GoSpellKeyboard
      - GoSpellShared
      # The app's String Catalog, so the keyboard's words (the GoSpell key menu first) follow
      # the iPhone's language where GoSpell is translated.
      - GoSpellMobile/Localizable.xcstrings
    dependencies:
      # Experiments › Speech model in keyboard: Parakeet in the keyboard (KeyboardParakeet).
      - package: FluidAudio
    info:
      path: GoSpellKeyboard/Info.plist
      properties:
        CFBundleDisplayName: GoSpell Keyboard
        NSMicrophoneUsageDescription: GoSpell turns what you say into text on this iPhone. Audio never leaves it and is deleted once it's transcribed.
        NSSpeechRecognitionUsageDescription: GoSpell uses Apple's on-device speech recognition to turn what you say into text. Nothing you say is sent to a server.
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: mul
            RequestsOpenAccess: true
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_ENTITLEMENTS: GoSpellKeyboard/GoSpellKeyboard.entitlements
        COREML_CODEGEN_LANGUAGE: None
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.goml.gospell.mobile.keyboard
        PRODUCT_NAME: GoSpellKeyboard
        SKIP_INSTALL: YES
  GoSpellWidgets:
    type: app-extension
    platform: iOS
    sources:
      - GoSpellWidgets
      - GoSpellActivity
      - GoSpellShared/GoSpellTheme.swift
    info:
      path: GoSpellWidgets/Info.plist
      properties:
        CFBundleDisplayName: GoSpell
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        APPLICATION_EXTENSION_API_ONLY: YES
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: 1
        GENERATE_INFOPLIST_FILE: NO
        MARKETING_VERSION: 9.0.0
        TARGETED_DEVICE_FAMILY: "1"
        PRODUCT_BUNDLE_IDENTIFIER: com.goml.gospell.mobile.widgets
        PRODUCT_NAME: GoSpellWidgets
        SKIP_INSTALL: YES
  GoSpellMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - GoSpellMobileTests
      - path: ../tests/fixtures/vocabulary/audio/term-gospell-1.wav
        buildPhase: resources
    dependencies:
      - target: GoSpellMobile
    settings:
      base:
        BUNDLE_LOADER: $(TEST_HOST)
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.goml.gospell.mobile.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/GOSPELL.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/GOSPELL