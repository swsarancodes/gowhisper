[land]
branch = "dev"
batch_max = 4
verify = [
  "cargo test --locked --workspace --lib",
  "[ -d sdk/node_modules ] || (cd sdk && bun install --frozen-lockfile)",
  "GOSPELL_TEAM_ID=${GOSPELL_TEAM_ID:-QC99C9JE59} GOSPELL_CAPTURE=1 GOSPELL_LOCAL_BUILD=1 scripts/build-app.sh",
]

[land.app]
target = "/Applications/GoSpell.app"
bundle = "target/app/GoSpell.app"
id = "com.goml.gospell"
exe = "gospell"
wait_idle = 30
install_cmd = "if [ -x \"$HOME/Library/Caches/gospell-install/install-gate.sh\" ]; then while [ \"$(\"$HOME/Library/Caches/gospell-install/install-gate.sh\")\" != ready ]; do sleep 5; done; fi && if [ -f \"$HOME/code/home/tools/gospell-autobuild/install.py\" ]; then python3 \"$HOME/code/home/tools/gospell-autobuild/install.py\" \"${HIVEMIND_LAND_HEAD:0:8}\" \"$PWD/target/app/GoSpell.app\"; else rm -rf /Applications/GoSpell.app && ditto \"$PWD/target/app/GoSpell.app\" /Applications/GoSpell.app && open -g /Applications/GoSpell.app; fi"
stamp = "~/Library/Caches/gospell-install/installed-rev"
